[project]
name = "agent-local"
version = "0.1.0"
description = "Local agent orchestrator — LangGraph + instructor + ToolRegistry + TraceStore"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "instructor>=1.6",
    "openai>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-mcp>=0.3",
    "anyio>=4.0",
    "openai>=2.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
agent = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
